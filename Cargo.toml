[package]
name = "rustdu"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "See where the disk space goes: folder sizes, permissions, git state and last activity"
license = "MIT"
repository = "https://github.com/7ucardie/RustDU"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false }
rayon = "1.12.0"
rfd = "0.17.2"
trash = "5.2.9"

[build-dependencies]
winresource = "0.1.34"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_Security", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
tray-icon = { version = "0.26.1", default-features = false }
raw-window-handle = "0.6.2"

[target."cfg(target_os = \"macos\")".dependencies]
tray-icon = { version = "0.26.1", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
