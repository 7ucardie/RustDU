[package]
name = "rustdu"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "See where the disk space goes: folder sizes, permissions, git state and last activity"
license = "MIT"
repository = "https://github.com/7ucardie/RustDU"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = "0.37.0"
rayon = "1.12.0"
rfd = "0.17.2"
trash = "5.2.9"

[build-dependencies]
winresource = "0.1.34"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_Security", "Win32_Foundation", "Win32_System_Memory"] }
