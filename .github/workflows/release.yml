name: Release

# Publishes binaries for Windows, macOS (signed and notarized) and Linux for a tag like v0.1.0.
# The Version workflow tags a merged release pull request and starts this; pushing a tag by hand works too.
# A tag with a hyphen (v0.1.0-rc.1) makes a pre-release.
# Secrets: MACOS_CERT_P12, MACOS_CERT_PASSWORD, APPLE_TEAM_ID to sign with a Developer ID, and with those
# NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER_ID to notarize. Without them the macOS bundles are still
# released, signed ad hoc only: Gatekeeper then asks the user to allow the app in System Settings.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # run it on a tag: the Version workflow does, with the tag it just made

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # Started by hand on a branch there is no version to release; the other jobs are skipped with this one.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  create:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name, .draft] | @tsv')"
          existing="$(printf '%s\n' "$releases" | awk -F '\t' -v tag="$GITHUB_REF_NAME" '$1 == tag { print $2 }')"
          if [ "$existing" = true ]; then
            echo "Resuming existing draft release for $GITHUB_REF_NAME"
            exit 0
          elif [ -n "$existing" ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published; refusing to overwrite its assets."
            exit 1
          fi
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          notes=""
          if [ -z "$MACOS_CERT_P12" ]; then
            notes="The macOS builds of this release are not signed with a Developer ID or notarized. On first start, allow RustDU under System Settings › Privacy & Security › Open Anyway."
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --notes "$notes" --draft $pre
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}

  build:
    needs: create
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: amd64
          # The oldest supported Ubuntu, so the binary also runs where glibc is older than the newest.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check macOS release secrets
        id: secrets
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # Missing secrets do not stop the release: the bundle is then built without that step.
          have() {
            for name in "$@"; do
              if [ -z "${!name}" ]; then
                echo "::warning::Release secret $name is not set."
                return 1
              fi
            done
          }
          sign=false; notarize=false
          if have MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_TEAM_ID; then sign=true; fi
          if [ "$sign" = true ] && have NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; then notarize=true; fi
          [ "$sign" = true ] || echo "::warning::macOS bundle will be signed ad hoc only (no Developer ID)."
          [ "$notarize" = true ] || echo "::warning::macOS bundle will not be notarized."
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Linux build and packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev imagemagick
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: sh packaging/linux-package.sh target/${{ matrix.target }}/release/rustdu "${GITHUB_REF_NAME#v}" ${{ matrix.arch }} .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rustdu-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-${{ matrix.arch }}"
          Compress-Archive -Path target/${{ matrix.target }}/release/rustdu.exe, README.md, LICENSE -DestinationPath "$name.zip"
          Copy-Item target/${{ matrix.target }}/release/rustdu.exe "$name.exe"
          ./packaging/windows-installer.ps1 target/${{ matrix.target }}/release/rustdu.exe $env:GITHUB_REF_NAME.TrimStart('v') .
      - name: Bundle without a Developer ID (macOS)
        if: runner.os == 'macOS' && steps.secrets.outputs.sign != 'true'
        run: |
          set -euo pipefail
          mkdir out
          sh packaging/macos-app.sh target/${{ matrix.target }}/release/rustdu "${GITHUB_REF_NAME#v}" out
          codesign --verify --strict --verbose=2 "out/RustDU.app"
      - name: Sign (macOS)
        if: runner.os == 'macOS' && steps.secrets.outputs.sign == 'true'
        timeout-minutes: 10
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # A throwaway keychain holding only the certificate, so codesign never prompts.
          kc="$RUNNER_TEMP/signing.keychain-db"; kc_pw="$(uuidgen)"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"

          mkdir out
          SIGN_IDENTITY="Developer ID Application" \
            sh packaging/macos-app.sh target/${{ matrix.target }}/release/rustdu "${GITHUB_REF_NAME#v}" out
          codesign --verify --strict --verbose=2 "out/RustDU.app"
          info="$(codesign -dv "out/RustDU.app" 2>&1)"
          [ -n "$APPLE_TEAM_ID" ] || { echo "APPLE_TEAM_ID secret is empty"; exit 1; }
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$info"
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && steps.secrets.outputs.notarize == 'true'
        timeout-minutes: 330
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          auth=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          ditto -c -k --keepParent "out/RustDU.app" "$RUNNER_TEMP/DiskExplorer.zip"
          id="$(xcrun notarytool submit "$RUNNER_TEMP/DiskExplorer.zip" "${auth[@]}" --output-format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "Notarization submission: $id"
          xcrun notarytool wait "$id" "${auth[@]}" --timeout 5h || true # the status check below decides
          status="$(xcrun notarytool info "$id" "${auth[@]}" --output-format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          echo "Notarization status: $status"
          if [ "$status" != "Accepted" ]; then
            [ "$status" = "In Progress" ] || xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
      - name: Staple (macOS)
        if: runner.os == 'macOS' && steps.secrets.outputs.notarize == 'true'
        run: |
          set -euo pipefail
          xcrun stapler staple "out/RustDU.app"
          spctl --assess --type execute --verbose=2 "out/RustDU.app"
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          tar -czf "rustdu-${GITHUB_REF_NAME#v}-darwin-${{ matrix.arch }}.tar.gz" -C out "RustDU.app"
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && steps.secrets.outputs.sign == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - run: |
          set -euo pipefail
          [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || {
            echo "::error::Release is already published; refusing to replace its assets."
            exit 1
          }
          gh release upload "$GITHUB_REF_NAME" rustdu-* --repo "$GITHUB_REPOSITORY" --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: SHA256SUMS for every release file
        run: |
          set -euo pipefail
          [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || {
            echo "::error::Release is already published; refusing to replace its checksums."
            exit 1
          }
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'rustdu-*' --dir assets
          cd assets && sha256sum rustdu-* > SHA256SUMS && cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

  publish:
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
