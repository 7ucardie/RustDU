name: Version

# Releases what lands on main without anyone picking a number: once CI passes there, the next version is
# worked out from the Conventional Commits since the last tag (packaging/next-version.sh), written to
# Cargo.toml and Cargo.lock, committed, tagged, and handed to the Release workflow.
# Commits that are only docs, ci, chore, build, test or refactor release nothing; run this workflow by hand
# with a bump to release them anyway.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Smallest bump to make (auto follows the commits and may release nothing)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    # Only CI runs for a push to this repository's main count: a fork's branch can be called main too.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version commit and tag
      actions: write # starting the Release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the commits since the last tag decide the version
          persist-credentials: false
      - name: Bump, tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$TESTED_SHA" ] && [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "main moved on since this CI run; the run for the newer commit releases it."
            exit 0
          fi
          case "$BUMP" in patch | minor | major) ;; *) BUMP="" ;; esac
          version="$(sh packaging/next-version.sh $BUMP)"
          if [ -z "$version" ]; then
            echo "Nothing to release: no feat, fix or breaking commit since the last tag."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          sh packaging/set-version.sh "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $version"
          git tag "v$version"
          # Both or neither: a tag without its commit on main, or the reverse, would need cleaning up by hand.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic origin HEAD:main "v$version"
          # A tag pushed with the workflow token starts no workflow, so the release is started explicitly.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$version"
          echo "Released v$version" >> "$GITHUB_STEP_SUMMARY"
